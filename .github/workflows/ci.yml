name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal
        env:
          # Os testes de interface gravam imagens das telas aqui (ver ViewSmokeTests.Snapshot).
          AMP_UI_SNAPSHOTS: ${{ github.workspace }}/ui-snapshots
      # TEMPORÁRIO (tirar antes do merge): imprime as telas no log, porque a sessão não consegue baixar o artefato.
      - name: Telas em base64
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $jpeg = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $params = New-Object System.Drawing.Imaging.EncoderParameters 1
          $params.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality, [long]88)
          Get-ChildItem ui-snapshots -Filter *.png | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $ms = New-Object System.IO.MemoryStream
            $img.Save($ms, $jpeg, $params)
            $b = [Convert]::ToBase64String($ms.ToArray())
            Write-Output "==BEGIN $($_.BaseName)=="
            for ($i = 0; $i -lt $b.Length; $i += 8000) { Write-Output $b.Substring($i, [Math]::Min(8000, $b.Length - $i)) }
            Write-Output "==END $($_.BaseName)=="
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: telas
          path: ui-snapshots/
          if-no-files-found: ignore
          retention-days: 14
