name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal
        env:
          # Os testes de interface gravam imagens das telas aqui (ver ViewSmokeTests.Snapshot).
          AMP_UI_SNAPSHOTS: ${{ github.workspace }}/ui-snapshots
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: telas
          path: ui-snapshots/
          if-no-files-found: ignore
          retention-days: 14
