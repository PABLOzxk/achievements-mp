name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal
        env:
          # Os testes de interface gravam imagens das telas aqui (ver ViewSmokeTests.Snapshot).
          AMP_UI_SNAPSHOTS: ${{ github.workspace }}/ui-snapshots
      # TEMPORÁRIO (PR #2): imprime as telas no log para conferência remota; sai antes do merge.
      - name: Telas em base64
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem ui-snapshots -Filter *.png -ErrorAction SilentlyContinue | ForEach-Object {
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            Write-Output "TELA-INICIO $($_.Name) $($b64.Length)"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { Write-Output ("TELA-B64 " + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))) }
            Write-Output "TELA-FIM $($_.Name)"
          }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: telas
          path: ui-snapshots/
          if-no-files-found: ignore
          retention-days: 14
